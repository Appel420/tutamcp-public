name: CI

on:
  push:
    branches:
    - main
    
  pull_request:
    branches: 
    - main
  workflow_dispatch:

permissions:
  contents: read

env:
  TUTAPROXY_REF: v1.3.15

jobs:
  test:
    runs-on: ['self-hosted, macos, arm64']
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "${GITHUB_SHA}"

      - name: Verify toolchain
        shell: bash
        working-directory: repo
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 -m pip --version
          git --version
          uname -m

      - name: Install tutaproxy package
        shell: bash
        working-directory: repo
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch "${TUTAPROXY_REF}" \
            https://github.com/peix2/tutaproxy-public.git ../tutaproxy-public
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            -e ../tutaproxy-public

      - name: Compile Python sources
        shell: bash
        working-directory: repo
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q server.py run.py tutamcp tests

      - name: Run unit tests
        shell: bash
        working-directory: repo
        run: |
          set -Eeuo pipefail
          python3 tests/run_all.py

      - name: Smoke-test server import
        shell: bash
        working-directory: repo
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import server
          print("server import: OK")
          PY

  docker:
    runs-on: ubuntu-24.04-arm
    needs: test
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "${GITHUB_SHA}"

      - name: Build Docker image
        shell: bash
        working-directory: repo
        run: |
          set -Eeuo pipefail
          docker build \
            --build-arg TUTAPROXY_REF="${TUTAPROXY_REF}" \
            --tag tutamcp:ci \
            .

      - name: Verify image metadata
        shell: bash
        working-directory: repo
        run: |
          set -Eeuo pipefail
          docker image inspect tutamcp:ci >/dev/null
          docker image inspect tutamcp:ci --format '{{.Architecture}}'
          docker image inspect tutamcp:ci --format '{{.Os}}'
